name: habitcraft
description: Gamified habit tracker for Android.
publish_to: "none"
version: 0.1.0+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon/icon.png"
  min_sdk_android: 21

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  provider: ^6.1.2
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/avatar/
    - assets/images/background/
    - assets/images/items/
    - assets/images/outfits/
    - assets/images/placeholders/
